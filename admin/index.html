<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HourTV — Panel de administración</title>
<style>
  :root{
    --bg:#0b0b0b; --surface:#141414; --card:#1f1f1f; --elev:#2b2b2b;
    --accent:#e50914; --accent2:#ff3341; --text:#f5f5f5; --muted:#b3b3b3; --dim:#6f6f6f;
    --ok:#2dd4a8; --warn:#ffb23e; --line:rgba(255,255,255,.08);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:14px}
  header{position:sticky;top:0;z-index:10;background:#0d0d0d;border-bottom:1px solid var(--line);padding:12px 18px;display:flex;align-items:center;gap:14px}
  .logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:18px}
  .logo .dot{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center}
  .logo .dot::after{content:'▶';font-size:13px;color:#fff}
  header .spacer{flex:1}
  button{font-family:inherit;font-size:14px;border:none;border-radius:8px;padding:9px 16px;cursor:pointer;font-weight:600;transition:.15s}
  button:active{transform:scale(.97)}
  .btn-primary{background:var(--accent);color:#fff}
  .btn-primary:hover{background:var(--accent2)}
  .btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
  .btn-ghost:hover{color:var(--text);border-color:var(--muted)}
  .btn-sm{padding:6px 11px;font-size:12px}
  .tabs{display:flex;gap:6px;padding:10px 18px 0;background:#0d0d0d;border-bottom:1px solid var(--line);overflow-x:auto}
  .tab{background:none;color:var(--muted);border-radius:8px 8px 0 0;padding:10px 16px;font-weight:600;white-space:nowrap;border-bottom:2px solid transparent}
  .tab.active{color:var(--accent);border-bottom-color:var(--accent)}
  main{max-width:1100px;margin:0 auto;padding:20px}
  .toolbar{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
  .toolbar input[type=search]{flex:1;min-width:180px}
  input,textarea,select{width:100%;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px;color:var(--text);font-family:inherit;font-size:14px;outline:none}
  input:focus,textarea:focus,select:focus{border-color:var(--accent)}
  label{display:block;color:var(--muted);font-size:12px;margin:0 0 5px;font-weight:600}
  textarea{resize:vertical;min-height:70px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
  .item{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer;transition:.15s}
  .item:hover{border-color:var(--accent);transform:translateY(-2px)}
  .item .thumb{width:100%;aspect-ratio:2/3;object-fit:cover;background:var(--elev);display:block}
  .item .thumb.ch{aspect-ratio:16/9;object-fit:contain;padding:8px}
  .item .cap{padding:8px 10px}
  .item .cap b{display:block;font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item .cap span{color:var(--dim);font-size:11px}
  .badge{display:inline-block;background:var(--accent);color:#fff;font-size:9px;font-weight:800;padding:2px 6px;border-radius:4px;letter-spacing:.4px;vertical-align:middle}
  .empty{text-align:center;color:var(--dim);padding:60px 20px}
  .sourcelist{display:flex;flex-direction:column;gap:10px}
  .source-row{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;cursor:pointer;transition:.15s}
  .source-row:hover{border-color:var(--accent)}
  .source-ic{font-size:22px;flex-shrink:0}
  .pend-thumb{width:40px;height:58px;object-fit:cover;border-radius:6px;flex-shrink:0;background:var(--elev)}
  .miss-chip{display:inline-block;background:rgba(229,9,20,.14);color:var(--accent2);border:1px solid rgba(229,9,20,.35);border-radius:5px;padding:1px 7px;margin-left:5px;font-size:11px;font-weight:700}
  .source-info{flex:1;min-width:0}
  .source-info b{display:block;font-size:14px}
  .source-info span{color:var(--dim);font-size:12px;word-break:break-all}
  /* Modal */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:50;display:none;align-items:center;justify-content:center;overflow:hidden;padding:clamp(12px,3vh,30px) 16px}
  .overlay.open{display:flex}
  .modal{background:var(--surface);border:1px solid var(--line);border-radius:14px;width:100%;max-width:820px;max-height:calc(100dvh - clamp(24px,6vh,60px));display:flex;flex-direction:column;overflow:hidden}
  .modal-head{display:flex;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line);background:var(--surface);border-radius:14px 14px 0 0;flex:0 0 auto}
  .modal-head h3{margin:0;font-size:17px;flex:1}
  .modal-body{padding:18px;overflow-y:auto;min-height:0;overscroll-behavior:contain}
  .row{margin-bottom:14px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
  .row4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  .rowtype{display:grid;grid-template-columns:160px 1fr;gap:12px}
  .check{display:flex;align-items:center;gap:10px;color:var(--text);font-size:14px;font-weight:600;cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:11px 12px}
  .check input{width:auto;margin:0;accent-color:var(--accent)}
  .section-label{color:var(--muted);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin:20px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
  .modal-foot{display:flex;gap:10px;justify-content:space-between;padding:16px 18px;border-top:1px solid var(--line);background:var(--surface);border-radius:0 0 14px 14px;flex:0 0 auto}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:6px 12px;font-size:12px;cursor:pointer;user-select:none}
  .chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .servers .srv{display:flex;gap:8px;align-items:center;margin-bottom:8px}
  .servers .srv input{flex:1}
  .servers .srv input.nm{max-width:150px}
  .language-group{background:rgba(255,255,255,.025);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px}
  .language-head{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
  .language-head input{flex:1;font-weight:700}
  .season{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}
  .season .sh{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .season .sh input{max-width:80px}
  .seasons .ep{background:rgba(0,0,0,.22);border:1px solid var(--line);border-radius:9px;padding:10px;margin-bottom:10px}
  .episode-head{display:grid;grid-template-columns:72px 1fr auto;gap:8px;align-items:center;margin-bottom:10px}
  .episode-head .nm{max-width:72px}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--elev);border:1px solid var(--line);border-radius:10px;padding:12px 20px;z-index:100;opacity:0;transition:.3s;pointer-events:none}
  .toast.show{opacity:1}
  .toast.ok{border-color:var(--ok)}
  .toast.err{border-color:var(--accent)}
  .thumbprev{width:52px;height:78px;object-fit:cover;border-radius:6px;background:var(--elev);flex-shrink:0}
  .thumbprev.wide{width:120px;height:68px}
  .imgfield{display:flex;gap:8px;align-items:stretch}
  .imgfield input[type=text],.imgfield>input{flex:1;min-width:0}
  .upload-btn{display:flex;align-items:center;justify-content:center;white-space:nowrap;flex-shrink:0;cursor:pointer;background:transparent;color:var(--muted);border:1px solid var(--line);border-radius:8px;padding:0 14px;font-size:13px;font-weight:600}
  .upload-btn:hover{color:var(--text);border-color:var(--muted)}
  .hint{color:var(--dim);font-size:12px;line-height:1.5}
  a{color:var(--accent2)}
  .status{font-size:12px;color:var(--muted)}
  .status b{color:var(--ok)}
  .del{color:var(--accent);background:none;border:none}
  @media (max-width:700px){
    header{flex-wrap:wrap}
    header .spacer{display:none}
    header .logo{flex:1;min-width:150px}
    header .status{order:3;width:100%}
    .overlay{padding:0;align-items:stretch}
    .modal{max-width:none;max-height:100dvh;min-height:100dvh;border-radius:0;border-left:0;border-right:0}
    .modal-head{border-radius:0}
    .modal-foot{border-radius:0;padding-bottom:max(16px,env(safe-area-inset-bottom))}
    .row2,.row3,.row4,.rowtype{grid-template-columns:1fr}
    .servers .srv{display:grid;grid-template-columns:minmax(0,1fr) auto}
    .servers .srv input.nm{grid-column:1/-1;max-width:none}
    .episode-head{grid-template-columns:64px minmax(0,1fr)}
    .episode-head button{grid-column:1/-1}
  }
</style>
</head>
<body>
<header>
  <div class="logo"><div class="dot"></div>HourTV <span style="color:var(--muted);font-weight:400">Admin</span></div>
  <div class="spacer"></div>
  <span class="status" id="status">Sin conectar</span>
  <button class="btn-ghost btn-sm" onclick="openConfig()">⚙ GitHub</button>
  <button class="btn-ghost btn-sm" onclick="loadFromGitHub()">↻ Cargar</button>
  <button class="btn-primary btn-sm" onclick="publish()">⬆ Publicar</button>
</header>

<div class="tabs" id="tabs"></div>
<main>
  <div class="toolbar">
    <input type="search" id="search" placeholder="Buscar…" oninput="render()">
    <button class="btn-primary" onclick="openEditor()">+ Añadir</button>
    <button class="btn-ghost" onclick="syncTrending()">📈 Sincronizar tendencias</button>
    <button class="btn-ghost" onclick="copyIptvUrl()">📺 URL IPTV</button>
    <button class="btn-ghost" onclick="exportJson()">Descargar JSON</button>
    <label class="btn-ghost" style="cursor:pointer;padding:9px 16px">Importar JSON<input type="file" accept=".json" onchange="importJson(event)" style="display:none"></label>
  </div>
  <div id="list"></div>
  <!-- Atribución exigida por los términos de uso de la API de TMDB. -->
  <footer style="margin:34px 0 18px;display:flex;align-items:center;gap:10px;color:var(--dim);font-size:12px">
    <span>Fichas, categorías y tendencias obtenidas de <a href="https://www.themoviedb.org" target="_blank" rel="noopener" style="color:var(--dim)">TMDB</a>. Este producto usa la API de TMDB pero no está avalado ni certificado por TMDB.</span>
  </footer>
</main>

<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>
// ---------- Estado ----------
const TABS = [
  {id:'movies', label:'Películas', kind:'vod'},
  {id:'series', label:'Series', kind:'series'},
  {id:'pending', label:'Pendientes', kind:'pending'},
  {id:'sources', label:'Canales en vivo', kind:'live'}
];
let catalog = {version:2, movies:[], series:[], sources:[]};
let activeTab = 'movies';
let cfg = JSON.parse(localStorage.getItem('hourtv_admin_cfg')||'{}');
// IDs eliminados aquí que todavía no se confirmaron publicados. Si al
// publicar hay conflicto (el catálogo remoto cambió, p.ej. por el scraper
// automático) se trae y fusiona lo remoto con lo local; sin esta lista, esa
// fusión traía de vuelta cualquier elemento que solo faltara porque tú lo
// habías borrado, no porque fuera nuevo.
let deletedIds = new Set(JSON.parse(localStorage.getItem('hourtv_admin_deleted')||'[]'));

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function toast(msg,type){const t=document.getElementById('toast');t.textContent=msg;t.className='toast show '+(type||'');setTimeout(()=>t.className='toast',2600)}
function save(){localStorage.setItem('hourtv_admin_catalog',JSON.stringify(catalog))}
function saveDeletedIds(){localStorage.setItem('hourtv_admin_deleted',JSON.stringify([...deletedIds]))}

// ---------- Pendientes ----------
// Campos clave que Server Hunter no rellena al publicar y que completas a mano.
// Una peli/serie está "pendiente" si le falta alguno.
function missingFields(item){
  const m=[];
  if(!item.year) m.push('año');
  if(!item.genre) m.push('género');
  if(item.rating==null||item.rating==='') m.push('rating');
  return m;
}
function isPending(item){return missingFields(item).length>0}
// Devuelve [{item, tab, idx, missing}] de películas y series incompletas.
function pendingItems(){
  const out=[];
  ['movies','series'].forEach(tab=>{
    (catalog[tab]||[]).forEach((item,idx)=>{
      const missing=missingFields(item);
      if(missing.length)out.push({item,tab,idx,missing});
    });
  });
  return out;
}
function tabCount(id){return id==='pending'?pendingItems().length:(catalog[id]||[]).length}

// ---------- Tabs ----------
function renderTabs(){
  document.getElementById('tabs').innerHTML = TABS.map(t=>
    `<button class="tab ${t.id===activeTab?'active':''}" onclick="setTab('${t.id}')">${t.label} <span style="color:var(--dim)">${tabCount(t.id)}</span></button>`
  ).join('');
}
function setTab(id){activeTab=id;document.getElementById('search').value='';renderTabs();render()}

// ---------- Listado ----------
function render(){
  renderTabs();
  const q=document.getElementById('search').value.toLowerCase().trim();
  if(activeTab==='pending'){renderPending(q);return}
  const isLive=activeTab==='sources';
  const items=(catalog[activeTab]||[]).filter(item=>!q||((item.title||item.name||'').toLowerCase().includes(q)));
  const list=document.getElementById('list');
  if(!items.length){
    list.className='';
    list.innerHTML=`<div class="empty">${isLive?'Sin fuentes IPTV. Pulsa “+ Añadir” para agregar una lista M3U, cuenta Xtream o portal Stalker.':'Sin contenido VOD. Pulsa “+ Añadir”.'}</div>`;
    return;
  }
  if(isLive){
    list.className='sourcelist';
    list.innerHTML=items.map(item=>{
      const idx=realIndex(item);
      const type=(item.type||'live');
      const typeLabel={live:'Lista M3U',xtream:'Xtream Codes',stalker:'Stalker / MAG'}[type]||type;
      const detail=type==='xtream'||type==='stalker'?esc(item.host||''):esc(item.url||'');
      return `<div class="source-row" onclick="openEditor(${idx})">
        <div class="source-ic">📡</div>
        <div class="source-info"><b>${esc(item.name||'Fuente')}</b><span>${typeLabel}${detail?' · '+detail:''}</span></div>
        <span style="color:var(--dim);font-size:18px">›</span>
      </div>`;
    }).join('');
    return;
  }
  const isSeries=activeTab==='series';
  list.className='grid';
  list.innerHTML=items.map(item=>{
    const idx=realIndex(item);
    const subtitle=isSeries?`${(item.seasons||[]).length} temp.`:(item.year||'');
    return `<div class="item" onclick="openEditor(${idx})">
      <img class="thumb" src="${esc(item.poster||'')}" onerror="this.style.visibility='hidden'">
      <div class="cap"><b>${esc(item.title)}</b><span>${subtitle}</span></div>
    </div>`;
  }).join('');
}
function realIndex(it){return (catalog[activeTab]||[]).indexOf(it)}

// Lista de películas/series incompletas, con los campos que faltan por llenar.
function renderPending(q){
  const list=document.getElementById('list');
  const rows=pendingItems().filter(p=>!q||(p.item.title||'').toLowerCase().includes(q));
  if(!rows.length){
    list.className='';
    list.innerHTML='<div class="empty">Nada pendiente. Todo el contenido tiene año, género y rating. 🎉</div>';
    return;
  }
  list.className='sourcelist';
  list.innerHTML=rows.map(p=>{
    const kind=p.tab==='series'?'Serie':'Película';
    const chips=p.missing.map(m=>`<span class="miss-chip">${m}</span>`).join('');
    return `<div class="source-row" onclick="openPending('${p.tab}',${p.idx})">
      <img class="pend-thumb" src="${esc(p.item.poster||'')}" onerror="this.style.visibility='hidden'">
      <div class="source-info"><b>${esc(p.item.title||'(sin título)')}</b><span>${kind} · falta: ${chips}</span></div>
      <span style="color:var(--dim);font-size:18px">›</span>
    </div>`;
  }).join('');
}
// Abre el editor de un pendiente en su pestaña real (movies o series).
function openPending(tab,idx){activeTab=tab;renderTabs();openEditor(idx)}

// ---------- Editor ----------
function serverRow(server){
  server=server||{};
  return `<div class="srv">
    <input class="nm" value="${esc(server.name||'')}" placeholder="Nombre del servidor">
    <input class="url" value="${esc(server.url||'')}" placeholder="URL HLS / MP4">
    <button type="button" class="del btn-sm" onclick="this.closest('.srv').remove()">✕</button>
  </div>`;
}
function languageGroupHtml(group){
  const servers=group.servers&&group.servers.length?group.servers:[{name:'Servidor 1',url:''}];
  return `<div class="language-group" data-language-group>
    <div class="language-head">
      <input class="language" value="${esc(group.language||'')}" placeholder="Idioma escrito manualmente, ej. Español">
      <button type="button" class="del btn-sm" onclick="this.closest('.language-group').remove()">Quitar idioma</button>
    </div>
    <div class="servers">${servers.map(serverRow).join('')}</div>
    <button type="button" class="btn-ghost btn-sm" onclick="this.closest('.language-group').querySelector('.servers').insertAdjacentHTML('beforeend',window._serverRow())">+ Añadir servidor</button>
  </div>`;
}
function languageGroups(servers){
  const groups=[];
  (servers&&servers.length?servers:[{name:'Servidor 1',url:'',language:''}]).forEach(server=>{
    const language=(server.language||server.idioma||'').trim();
    let group=groups.find(item=>item.language.toLowerCase()===language.toLowerCase());
    if(!group){group={language,servers:[]};groups.push(group)}
    group.servers.push(server);
  });
  return groups.map(languageGroupHtml).join('');
}
window._serverRow=()=>serverRow({});
window._languageGroup=()=>languageGroupHtml({language:'',servers:[]});
function addLanguageGroup(container){
  const target=typeof container==='string'?document.getElementById(container):container;
  if(target)target.insertAdjacentHTML('beforeend',window._languageGroup());
}
function collectServers(scope){
  const servers=[];
  [...scope.querySelectorAll(':scope > .language-group')].forEach(group=>{
    const language=group.querySelector('.language').value.trim();
    [...group.querySelectorAll('.srv')].forEach(row=>{
      const name=row.querySelector('.nm').value.trim()||'Servidor';
      const url=row.querySelector('.url').value.trim();
      if(url)servers.push({name,url,language});
    });
  });
  return servers;
}
function hasMissingLanguage(scope){
  return [...scope.querySelectorAll(':scope > .language-group')].some(group=>{
    const hasUrl=[...group.querySelectorAll('.url')].some(input=>input.value.trim());
    return hasUrl&&!group.querySelector('.language').value.trim();
  });
}

// Campo de imagen: miniatura de vista previa + URL a mano o subir un archivo
// local (se sube a GitHub y autocompleta la URL). ratio: 'wide' para 16:9.
function imageField(id, label, value, previewId, ratio){
  const fileId = id+'_file';
  const preview = previewId
    ? `<img id="${previewId}" class="thumbprev ${ratio==='wide'?'wide':''}" src="${esc(value)}" onerror="this.style.visibility='hidden'" onload="this.style.visibility='visible'">`
    : '';
  const previewAttr = previewId
    ? ` oninput="document.getElementById('${previewId}').src=this.value"` : '';
  return `<div class="row"><label>${label}</label>
    <div class="imgfield">
      ${preview}
      <input type="text" id="${id}" value="${esc(value)}" placeholder="Pega una URL o sube un archivo"${previewAttr}>
      <label class="upload-btn">Subir…
        <input type="file" accept="image/*" id="${fileId}" style="display:none" onchange="if(this.files[0])uploadImage(this.files[0],'${id}'${previewId?`,'${previewId}'`:''});this.value=''">
      </label>
    </div></div>`;
}

// Categorías/filas predefinidas para el Inicio. El usuario marca las que
// apliquen; determinan en qué filas aparece la película.
// "tendencias" no se marca a mano: la pone "Sincronizar tendencias" con los
// datos reales de TMDB. Se deja visible para poder revisarla y corregirla.
// `let` (no `const`): TMDB tiene generos que no tienen chip fijo aca (Misterio,
// Fantasía, Guerra...) y antes se perdian en silencio al autocompletar. Ahora
// se agregan solos la primera vez que aparecen, y quedan guardados.
let CATEGORIES = ['tendencias','recomendado','estrenos','populares','antiguas','terror','accion','comedia','romance','aventura','drama','infantil','anime','novelas'];
const _extraCategoriesKey='hourtv_admin_extra_categories';
function loadExtraCategories(){
  try{return JSON.parse(localStorage.getItem(_extraCategoriesKey)||'[]')}catch(e){return []}
}
function saveExtraCategories(list){
  try{localStorage.setItem(_extraCategoriesKey,JSON.stringify(list))}catch(e){}
}
loadExtraCategories().forEach(c=>{if(!CATEGORIES.includes(c))CATEGORIES.push(c)});
function categoryChips(selected){
  const sel = (selected||[]).map(c=>String(c).toLowerCase());
  return CATEGORIES.map(c=>
    `<div class="chip ${sel.includes(c)?'on':''}" data-cat="${c}" onclick="this.classList.toggle('on')">${esc(c)}</div>`
  ).join('') + `<div class="chip" onclick="addCustomCategory()">+ nueva</div>`;
}
function collectCategories(){
  const on=[...document.querySelectorAll('#f_categories .chip.on')].map(c=>c.dataset.cat);
  return on.length?on:undefined;
}
// Da de alta categorias que classify() detecto pero que todavia no tenian
// chip: se agregan a CATEGORIES y se guardan en localStorage para que sigan
// disponibles despues, en otras peliculas/series y tras recargar la pagina.
function registerNewCategories(cats){
  const extra=loadExtraCategories();
  let changed=false;
  (cats||[]).forEach(c=>{
    if(!CATEGORIES.includes(c)){CATEGORIES.push(c);changed=true}
    if(!extra.includes(c)){extra.push(c);changed=true}
  });
  if(changed)saveExtraCategories(extra);
}
// Boton "+ nueva": alta manual de una categoria que TMDB no trajo pero que
// el usuario quiere de todos modos.
function addCustomCategory(){
  const name=prompt('Nombre de la categoría nueva (ej: misterio)');
  if(!name)return;
  const slug=name.trim().toLowerCase();
  if(!slug)return;
  registerNewCategories([slug]);
  const already=collectCategories()||[];
  document.getElementById('f_categories').innerHTML=
    categoryChips([...new Set([...already,slug])]);
}

// ---------- Clasificación automática ----------
// Traduce los datos reales de TMDB (géneros, país de origen, fecha, votos) a
// las categorías del Inicio. Reemplaza el marcar a ojo.
const TMDB_GENRE_CAT = {
  28:'accion', 12:'aventura', 16:'infantil', 35:'comedia', 18:'drama',
  // Ojo: 10751 "Family" de TMDB NO es infantil (se lo ponen a dramas duros
  // como Fatmagül). Infantil solo sale de 10762 "Kids" o de animación.
  27:'terror', 10749:'romance', 10762:'infantil',
  10766:'novelas', 878:'aventura', 53:'terror', 80:'drama', 9648:'terror',
  10759:'accion', 10765:'aventura'
};
// `info` es lo que devuelve /api/tmdb?action=detail.
function classify(info){
  const ids=info.genreIds||[];
  const cats=new Set();
  ids.forEach(id=>{const c=TMDB_GENRE_CAT[id];if(c)cats.add(c)});

  const origin=(info.originCountry||[]).map(c=>c.toUpperCase());
  const lang=(info.originalLanguage||'').toLowerCase();
  // Anime = animación + origen japonés. Sin el origen, "animación" sola
  // metería Pixar y Disney en la fila de anime.
  const animated=ids.includes(16);
  if(animated&&(origin.includes('JP')||lang==='ja')){cats.add('anime');cats.delete('infantil')}
  // Telenovela: el género Soap de TMDB cuando está puesto. Pero lo aplican de
  // forma irregular (La Reina del Flow figura solo como drama/crimen), así que
  // se añade el rasgo que de verdad distingue a una novela: producción latina
  // o turca, drama, y una tirada de episodios que ninguna serie normal tiene.
  // Se mira el IDIOMA original, no el país: TMDB registra Pasión de gavilanes
  // como estadounidense por ser de Telemundo. Y el idioma evita el falso
  // positivo obvio del país-más-episodios, que colaría Grey's Anatomy.
  const NOVELA_IDIOMA=['es','pt','tr'];
  const NOVELA_PAIS=['CO','MX','VE','BR','AR','PE','CL','EC','TR'];
  if(ids.includes(10766))cats.add('novelas');
  else if((NOVELA_IDIOMA.includes(lang)||origin.some(c=>NOVELA_PAIS.includes(c)))
          &&ids.includes(18)&&(info.episodes||0)>=60){
    cats.add('novelas');
  }

  const year=info.year;
  const now=new Date();
  if(info.releaseDate){
    const days=(now-new Date(info.releaseDate))/86400000;
    if(days>=0&&days<=120)cats.add('estrenos');
  }
  if(year&&year<1990)cats.add('antiguas');
  // Popular / recomendado con los números de TMDB, no a ojo. Se usa el número
  // de votos, no `popularity`: TMDB rebajó la escala de popularidad y hoy un
  // taquillazo ronda 20, así que cualquier umbral fijo sobre ella envejece mal.
  if((info.votes||0)>=2000)cats.add('populares');
  if((info.rating||0)>=7.5&&(info.votes||0)>=500)cats.add('recomendado');
  // Generos de TMDB sin categoria fija arriba (Misterio, Fantasía, Guerra,
  // Western, Documental...): antes se perdian en silencio. Se devuelven tal
  // cual (en minuscula) para que quien llama cree el chip si hace falta;
  // classify() se mantiene puro (sin tocar el DOM ni localStorage aca).
  const mappedIds=new Set(Object.keys(TMDB_GENRE_CAT).map(Number));
  const genreIds=info.genreIds||[];
  (info.genres||[]).forEach((name,idx)=>{
    const id=genreIds[idx];
    if(id!=null&&mappedIds.has(id))return;
    const slug=String(name||'').trim().toLowerCase();
    if(slug)cats.add(slug);
  });
  return [...cats];
}

// ---------- TMDB ----------
async function tmdbApi(params){
  const r=await fetch('/api/tmdb?'+params);
  const data=await r.json().catch(()=>({error:'Respuesta no válida de /api/tmdb'}));
  if(!r.ok||data.error)throw new Error(data.error||('HTTP '+r.status));
  return data;
}

// Busca por el título escrito y ofrece los candidatos. No elige solo: los
// títulos del catálogo suelen venir con sufijos ("Latino", "1080p") y una
// coincidencia automática rellenaría la ficha equivocada.
async function tmdbSearch(){
  const title=val('f_title');
  const box=document.getElementById('tmdb_results');
  if(!title){toast('Escribe primero el título','err');return}
  box.innerHTML='<div style="color:var(--dim);font-size:12px;padding:8px 0">Buscando…</div>';
  try{
    const {results}=await tmdbApi('action=search&q='+encodeURIComponent(title)+(val('f_year')?'&year='+val('f_year'):''));
    if(!results.length){box.innerHTML='<div style="color:var(--dim);font-size:12px;padding:8px 0">Sin resultados. Prueba con el título original, sin “Latino”, “HD” ni el año.</div>';return}
    box.innerHTML='<div class="sourcelist" style="margin-top:8px">'+results.map(r=>
      `<div class="source-row" onclick="tmdbPick('${r.tmdbType}',${r.tmdbId})">
        <img class="pend-thumb" src="${esc(r.poster||'')}" onerror="this.style.visibility='hidden'">
        <div class="source-info"><b>${esc(r.title)}</b><span>${r.tmdbType==='tv'?'Serie':'Película'}${r.year?' · '+r.year:''}${r.rating?' · ★'+r.rating:''}${r.originalTitle&&r.originalTitle!==r.title?' · '+esc(r.originalTitle):''}</span></div>
      </div>`).join('')+'</div>';
  }catch(e){box.innerHTML='<div style="color:var(--accent);font-size:12px;padding:8px 0">'+esc(e.message)+'</div>'}
}

// Rellena SOLO los campos vacíos: lo que ya escribiste a mano manda.
// Dispara 'input' a mano: asignar .value por JS no lo hace solo, y la
// vista previa de carátula/fondo (imageField) depende de ese evento para
// actualizarse. Sin esto, la URL quedaba bien guardada pero la imagen
// parecía no haberse autocompletado porque la miniatura nunca cambiaba.
function fill(id,value){
  const el=document.getElementById(id);
  if(el&&value!=null&&value!==''&&!el.value){
    el.value=value;
    el.dispatchEvent(new Event('input'));
  }
}
// Igual que fill(), pero reemplaza el valor aunque ya haya uno: para la
// miniatura y la sinopsis, lo que trae TMDB es lo que de verdad importa que
// quede bien (a diferencia de reparto/director, donde lo escrito a mano
// manda), así que "Autocompletar ficha" las actualiza aunque el catálogo ya
// trajera algo puesto ahí.
function set(id,value){
  const el=document.getElementById(id);
  if(el&&value!=null&&value!==''){
    el.value=value;
    el.dispatchEvent(new Event('input'));
  }
}
// true si TMDB reporta este id en tendencia esta semana. Misma fuente que
// "Sincronizar tendencias", consultada aparte porque autocompletar es por
// un solo título, no todo el catálogo.
async function isTrending(tmdbId){
  try{
    const data=await tmdbApi('action=trending&window=week');
    return data.results.some(r=>r.tmdbId===Number(tmdbId));
  }catch(e){return false}
}
async function tmdbPick(type,id){
  const box=document.getElementById('tmdb_results');
  try{
    const info=await tmdbApi('action=detail&type='+type+'&id='+id);
    // Ya elegiste este resultado a mano de la lista de búsqueda: el título
    // que trae TMDB es el correcto para esa ficha, así que reemplaza lo que
    // hubieras escrito (a diferencia de fill(), que respeta lo ya escrito).
    set('f_title',info.title);
    set('f_plot',info.plot);
    fill('f_cast',info.cast);
    fill('f_director',info.director);
    fill('f_writer',info.writer);
    fill('f_genre',(info.genres||[]).join(', '));
    fill('f_release_date',info.releaseDate);
    fill('f_year',info.year);
    fill('f_rating',info.rating);
    fill('f_duration',info.duration);
    set('f_poster',info.poster);
    fill('f_backdrop',info.backdrop);
    document.getElementById('f_tmdb_id').value=info.tmdbId;
    document.getElementById('f_tmdb_type').value=info.tmdbType;
    // Si TMDB trae un genero sin chip fijo (Misterio, Fantasía...), se crea
    // solo y se autoselecciona (antes se perdia en silencio). Se regenera el
    // HTML de los chips en vez de solo alternar 'on': un chip nuevo todavia
    // no existe en el DOM. Lo ya marcado a mano no se pierde.
    const tmdbCats=classify(info);
    registerNewCategories(tmdbCats);
    const alreadyCats=collectCategories()||[];
    document.getElementById('f_categories').innerHTML=
      categoryChips([...new Set([...alreadyCats,...tmdbCats])]);
    // Destacado (banner grande de Inicio): se autoselecciona solo si TMDB
    // reporta el título en tendencia. No se desmarca si ya estaba marcado
    // a mano por otra razón.
    const trending=await isTrending(info.tmdbId);
    const featured=document.getElementById('f_featured');
    if(featured&&trending)featured.checked=true;
    box.innerHTML='';
    document.getElementById('tmdb_state').textContent='Vinculado a TMDB #'+info.tmdbId+' · ficha y categorías rellenadas'+(trending?' · en tendencia':'');
    toast('Ficha completada desde TMDB'+(trending?' (en tendencia: Destacado marcado)':''));
  }catch(e){box.innerHTML='<div style="color:var(--accent);font-size:12px;padding:8px 0">'+esc(e.message)+'</div>'}
}

// Marca como "tendencias" lo que TMDB reporta en tendencia esta semana, y se
// la quita al resto. Sin esto la fila de Tendencias del Inicio es un adorno.
async function syncTrending(){
  toast('Consultando tendencias de TMDB…');
  let data;
  try{data=await tmdbApi('action=trending&window=week')}
  catch(e){toast(e.message,'err');return}

  const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,' ').trim();
  const byId=new Set(data.results.map(r=>r.tmdbId));
  const byTitle=new Set(data.results.flatMap(r=>[norm(r.title),norm(r.originalTitle)]).filter(Boolean));

  let added=0, removed=0, matched=0;
  ['movies','series'].forEach(tab=>{
    (catalog[tab]||[]).forEach(item=>{
      // El id de TMDB es exacto; el título es el respaldo para lo que aún no
      // has vinculado con "Autocompletar".
      const hit=(item.tmdbId&&byId.has(Number(item.tmdbId)))||byTitle.has(norm(item.title));
      const cats=(item.categories||[]).map(c=>String(c).toLowerCase());
      const has=cats.includes('tendencias');
      if(hit)matched++;
      if(hit&&!has){item.categories=[...cats,'tendencias'];added++}
      else if(!hit&&has){
        const rest=cats.filter(c=>c!=='tendencias');
        item.categories=rest.length?rest:undefined;
        removed++;
      }
    });
  });
  save();render();
  toast(matched?`Tendencias: ${matched} coinciden (+${added} nuevas, −${removed} caducadas)`
                :'Nada de tu catálogo está en tendencia esta semana');
}

function saveItem(idx){
  if(activeTab==='sources') return saveSource(idx);
  const originalTab=activeTab;
  const targetTab=val('f_content_type')==='series'?'series':'movies';
  const releaseDate=val('f_release_date');
  const ratingText=val('f_rating');
  const rating=ratingText===''?undefined:Number(ratingText);
  if(!val('f_title')){toast('El título es obligatorio','err');return}
  if(rating!==undefined&&(Number.isNaN(rating)||rating<0||rating>10)){
    toast('El rating debe estar entre 0 y 10','err');return;
  }
  const current=idx!=null?catalog[originalTab][idx]:null;
  const featured=document.getElementById('f_featured');
  const obj={
    id:(current&&current.id)||uid(),
    title:val('f_title'),
    plot:val('f_plot')||undefined,
    cast:val('f_cast')||undefined,
    director:val('f_director')||undefined,
    writer:val('f_writer')||undefined,
    releaseDate:releaseDate||undefined,
    year:val('f_year')||(releaseDate?releaseDate.slice(0,4):undefined),
    genre:val('f_genre')||undefined,
    rating,
    duration:val('f_duration')||undefined,
    poster:val('f_poster')||undefined,
    backdrop:val('f_backdrop')||undefined,
    categories:collectCategories(),
    featured:featured&&featured.checked?true:undefined,
    // Vínculo con TMDB: hace que "Sincronizar tendencias" acierte por id en
    // vez de tener que adivinar por el título.
    tmdbId:val('f_tmdb_id')?Number(val('f_tmdb_id')):undefined,
    tmdbType:val('f_tmdb_type')||undefined
  };

  if(targetTab==='series'){
    let invalid=false;
    obj.seasons=[...document.querySelectorAll('#f_seasons .season')].map(section=>({
      number:parseInt(section.querySelector('.snum').value)||1,
      episodes:[...section.querySelectorAll(':scope > .eps > .ep')].map(episode=>{
        const scope=episode.querySelector('.episode-servers');
        const servers=collectServers(scope);
        if(!servers.length||hasMissingLanguage(scope))invalid=true;
        return {
          number:parseInt(episode.querySelector('.nm').value)||1,
          title:episode.querySelector('.t').value.trim()||undefined,
          servers
        };
      }).filter(episode=>episode.servers.length)
    })).filter(season=>season.episodes.length);
    if(invalid||!obj.seasons.length){
      toast('Cada episodio necesita idioma y al menos un servidor','err');return;
    }
  }else{
    const scope=document.getElementById('f_servers');
    obj.servers=collectServers(scope);
    if(hasMissingLanguage(scope)){
      toast('Escribe el idioma de cada grupo de servidores','err');return;
    }
    if(!obj.servers.length){
      toast('Añade al menos un servidor','err');return;
    }
  }

  if(idx!=null&&targetTab===originalTab){
    catalog[targetTab][idx]=obj;
  }else{
    if(idx!=null)catalog[originalTab].splice(idx,1);
    catalog[targetTab].push(obj);
  }
  activeTab=targetTab;
  save();closeModal();render();
  toast('Guardado localmente. Pulsa “Publicar” para subirlo.','ok');
  return true;
}
// Guarda el elemento y, si se guardó bien, publica todo el catálogo a GitHub.
async function saveAndPublish(idx){
  if(saveItem(idx)===true) await publish();
}
// Borra y publica de inmediato: cuanto más tiempo quede solo en local, más
// chance de que el bot automático haga otro commit de por medio y haya que
// pasar por el camino de fusión de publish() (que ya respeta deletedIds,
// pero es más simple si el borrado nunca llega a quedar pendiente).
async function removeItem(idx){
  if(!confirm('¿Eliminar este elemento?'))return;
  const [removed]=catalog[activeTab].splice(idx,1);
  if(removed&&removed.id){deletedIds.add(removed.id);saveDeletedIds()}
  save();closeModal();render();
  await publish();
}

// ---------- Import / export ----------
// URL de la lista IPTV para pegar en apps externas (TiviMate, IPTV Smarters…).
function copyIptvUrl(){
  const url=location.origin+'/lista.m3u';
  const done=()=>toast('URL IPTV copiada: '+url,'ok');
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(url).then(done,()=>prompt('Copia la URL IPTV:',url));
  }else{prompt('Copia la URL IPTV:',url)}
}
function exportJson(){
  const blob=new Blob([JSON.stringify(catalog,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='catalog.json';a.click();
}
function importJson(ev){
  const f=ev.target.files[0];if(!f)return;
  const r=new FileReader();r.onload=()=>{try{catalog=normalize(JSON.parse(r.result));save();render();toast('Importado','ok')}catch(e){toast('JSON inválido','err')}};r.readAsText(f);
}
function normalize(c){
  c=c||{};
  return {
    version:2,
    movies:Array.isArray(c.movies)?c.movies:[],
    series:Array.isArray(c.series)?c.series:[],
    // Fuentes IPTV (listas M3U / Xtream / Stalker) y canales sueltos: se
    // conservan para no perderlos al cargar/guardar.
    sources:Array.isArray(c.sources)?c.sources:[],
    liveChannels:Array.isArray(c.liveChannels)?c.liveChannels:[]
  };
}

// ---------- GitHub ----------
function openConfig(){
  document.getElementById('modal').innerHTML=`
    <div class="modal-head"><h3>Conexión con GitHub</h3><button class="btn-ghost btn-sm" onclick="closeModal()">✕</button></div>
    <div class="modal-body">
      <p class="hint">El panel guarda el catálogo directamente en tu repositorio. El token se queda solo en este navegador (localStorage), nunca se envía a otro sitio.</p>
      <div class="row"><label>Usuario / organización</label><input id="c_owner" value="${esc(cfg.owner)}" placeholder="tu-usuario"></div>
      <div class="row"><label>Repositorio</label><input id="c_repo" value="${esc(cfg.repo)}" placeholder="hourtv-catalogo"></div>
      <div class="row2">
        <div class="row"><label>Rama</label><input id="c_branch" value="${esc(cfg.branch||'main')}"></div>
        <div class="row"><label>Ruta del archivo</label><input id="c_path" value="${esc(cfg.path||'catalog.json')}"></div>
      </div>
      <div class="row"><label>Token de acceso (fine-grained, permiso Contents: Read & Write)</label>
        <input id="c_token" type="password" value="${esc(cfg.token)}" placeholder="github_pat_…"></div>
      <p class="hint">Crea el token en <a href="https://github.com/settings/tokens?type=beta" target="_blank">github.com/settings/tokens</a> con acceso solo a ese repositorio.<br>
      URL para pegar en la app (Ajustes → catálogo remoto):<br>
      <b id="rawurl" style="color:var(--ok);word-break:break-all"></b></p>
    </div>
    <div class="modal-foot"><span></span><button class="btn-primary" onclick="saveConfig()">Guardar conexión</button></div>`;
  document.getElementById('overlay').classList.add('open');
  updateRawUrl();
  ['c_owner','c_repo','c_branch','c_path'].forEach(id=>document.getElementById(id).oninput=updateRawUrl);
}
function updateRawUrl(){
  const o=val('c_owner'),r=val('c_repo'),b=val('c_branch')||'main',p=val('c_path')||'catalog.json';
  const el=document.getElementById('rawurl');
  if(el)el.textContent = (o&&r)?`https://raw.githubusercontent.com/${o}/${r}/${b}/${p}`:'(completa usuario y repo)';
}
function saveConfig(){
  cfg={owner:val('c_owner'),repo:val('c_repo'),branch:val('c_branch')||'main',path:val('c_path')||'catalog.json',token:val('c_token')};
  localStorage.setItem('hourtv_admin_cfg',JSON.stringify(cfg));closeModal();refreshStatus();toast('Conexión guardada','ok');
}
function refreshStatus(){
  const s=document.getElementById('status');
  s.innerHTML = cfg.owner&&cfg.repo ? `Repo: <b>${esc(cfg.owner)}/${esc(cfg.repo)}</b>` : 'Sin conectar';
}
async function ghApi(method,extra){
  if(!cfg.token||!cfg.owner||!cfg.repo){toast('Configura GitHub primero','err');openConfig();throw new Error('no cfg')}
  const url=`https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${encodeURIComponent(cfg.path).replace(/%2F/g,'/')}`;
  return fetch(url+(method==='GET'?`?ref=${cfg.branch}`:''),{
    method, headers:{Authorization:`Bearer ${cfg.token}`,Accept:'application/vnd.github+json'},
    ...(extra||{})
  });
}
// ---------- Subida de imágenes (archivo local -> GitHub -> URL) ----------
function fileToBase64(file){
  return new Promise((resolve,reject)=>{
    const r=new FileReader();
    r.onload=()=>resolve(r.result.split(',')[1]);
    r.onerror=reject;
    r.readAsDataURL(file);
  });
}
async function uploadImage(file, targetInputId, previewId){
  if(!cfg.token||!cfg.owner||!cfg.repo){toast('Configura GitHub primero','err');openConfig();return}
  if(file.size > 8*1024*1024){toast('Imagen muy pesada (máx. 8 MB)','err');return}
  toast('Subiendo imagen…');
  try{
    const ext = (file.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'')||'jpg';
    const path = `images/${uid()}.${ext}`;
    const content = await fileToBase64(file);
    const url = `https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${path}`;
    const res = await fetch(url,{
      method:'PUT',
      headers:{Authorization:`Bearer ${cfg.token}`,Accept:'application/vnd.github+json'},
      body:JSON.stringify({message:'Subir imagen desde el panel HourTV', content, branch:cfg.branch}),
    });
    if(!res.ok){const e=await res.json().catch(()=>({}));toast('Error al subir: '+(e.message||res.status),'err');return}
    // jsdelivr sirve el repo publico como CDN: mas rapido y sin los limites
    // de hotlinking de raw.githubusercontent.com para muchas imagenes.
    const cdnUrl = `https://cdn.jsdelivr.net/gh/${cfg.owner}/${cfg.repo}@${cfg.branch}/${path}`;
    const input = document.getElementById(targetInputId);
    if(input){input.value=cdnUrl; input.dispatchEvent(new Event('input'))}
    if(previewId){const pv=document.getElementById(previewId); if(pv){pv.src=cdnUrl; pv.style.visibility=''}}
    toast('Imagen subida','ok');
  }catch(e){toast('Fallo al subir la imagen','err')}
}

async function loadFromGitHub(){
  try{
    const res=await ghApi('GET');
    if(res.status===404){toast('El archivo no existe aún — se creará al publicar','warn');return}
    if(!res.ok){toast('Error '+res.status+' al cargar','err');return}
    const data=await res.json();
    const content=decodeURIComponent(escape(atob(data.content.replace(/\n/g,''))));
    catalog=normalize(JSON.parse(content));window._sha=data.sha;save();render();
    toast('Catálogo cargado desde GitHub','ok');
  }catch(e){toast('No se pudo cargar','err')}
}
async function currentSha(){
  try{const g=await ghApi('GET');if(g.ok)return (await g.json()).sha}catch(e){}
  return undefined;
}
function putCatalog(sha){
  const content=btoa(unescape(encodeURIComponent(JSON.stringify(catalog,null,2))));
  return ghApi('PUT',{body:JSON.stringify({
    message:'Actualizar catálogo desde el panel HourTV',
    content, branch:cfg.branch, ...(sha?{sha}:{})
  })});
}
// Fusiona lo que llegó del catálogo remoto (por ejemplo, títulos nuevos que
// agregó el scraper automático mientras editabas aquí) con el catálogo local:
// se conserva la versión local de cada elemento ya presente (es lo que se
// está publicando a propósito), y se añade lo que solo existe en remoto.
function mergeCatalogs(local,remote){
  const merged=normalize(local);
  ['movies','series','sources','liveChannels'].forEach(key=>{
    const localList=merged[key]||[];
    const remoteList=(remote&&remote[key])||[];
    const localIds=new Set(localList.map(it=>it&&it.id).filter(Boolean));
    const onlyRemote=remoteList.filter(it=>it&&it.id&&!localIds.has(it.id)&&!deletedIds.has(it.id));
    merged[key]=[...localList,...onlyRemote];
  });
  return merged;
}
async function publish(){
  if(!cfg.token){toast('Configura GitHub primero','err');openConfig();return}
  try{
    let res=await putCatalog(await currentSha());
    // 409/422 = el catálogo remoto cambió desde que se cargó aquí. Antes
    // esto solo pedía un sha fresco y reenviaba el MISMO catálogo local,
    // borrando en silencio cualquier título que el scraper automático
    // hubiera agregado justo en ese momento. Ahora se trae lo remoto, se
    // fusiona con lo local, y recién con eso se reintenta.
    if(res.status===409||res.status===422){
      const g=await ghApi('GET');
      if(g.ok){
        const data=await g.json();
        const content=decodeURIComponent(escape(atob(data.content.replace(/\n/g,''))));
        const remote=normalize(JSON.parse(content));
        catalog=mergeCatalogs(catalog,remote);
        save();render();
        res=await putCatalog(data.sha);
        if(res.ok)toast('Se fusionaron títulos nuevos del catálogo automático antes de publicar','warn');
      }
    }
    if(res.ok){
      window._sha=(await res.json()).content.sha;
      // Ya quedaron fuera del catálogo remoto publicado: no hace falta
      // seguir protegiéndolos de una futura fusión.
      deletedIds.clear();saveDeletedIds();
      toast('¡Publicado! La app lo verá solo con volver a primer plano.','ok');
    }
    else{const e=await res.json().catch(()=>({}));toast('Error: '+(e.message||res.status),'err')}
  }catch(e){toast('Fallo al publicar','err')}
}

// ---------- Init ----------
(function(){
  const local=localStorage.getItem('hourtv_admin_catalog');
  if(local){try{catalog=normalize(JSON.parse(local))}catch(e){}}
  refreshStatus();render();
})();
</script>
