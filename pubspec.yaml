name: streamtv
description: HourTV - App IPTV personal para Android, TV y PC
publish_to: none
version: 1.1.37+39

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  video_player: ^2.9.3
  # Web-only adapter uses the same already-resolved implementation versions.
  video_player_web: 2.4.0
  video_player_platform_interface: 6.8.0
  chewie: ^1.10.0
  http: ^1.4.0
  html: ^0.15.6
  crypto: ^3.0.7
  shared_preferences: ^2.5.3
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  path_provider: ^2.1.6
  url_launcher: ^6.3.1
  connectivity_plus: ^6.1.4
  webview_flutter: 4.14.1
  # Para el iframe del reproductor en la versión web.
  web: ^1.1.1
  flutter_chrome_cast: 1.4.6
  package_info_plus: ^10.2.1
  open_filex: ^4.7.0
  supabase_flutter: 2.17.2
  google_sign_in: 7.2.0
  drift: 2.35.0
  drift_flutter: 0.3.1
  unity_levelplay_mediation: ^9.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: 2.35.0
  build_runner: 2.15.1
  postgres: ^3.2.1

flutter:
  uses-material-design: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
  assets:
    - assets/
    - assets/data/
    - assets/branding/
    - assets/design/
    - assets/figma/phase-3-1/
    - assets/fonts/
